<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiszki – Słownictwo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --card-bg: #18181b;
    --gold: #f5c842;
    --gold-dim: #c9a12a;
    --text: #f0ede6;
    --muted: #7a7870;
    --green: #4ade80;
    --red: #f87171;
    --border: #2a2a2e;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(245,200,66,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
    position: relative;
    z-index: 1;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--gold);
    line-height: 1;
  }

  header p {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 0.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 2rem;
    z-index: 1;
    position: relative;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
  }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 2rem;
    margin-bottom: 2rem;
    z-index: 1;
    position: relative;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .stats span b { color: var(--text); font-weight: 500; }
  .stats .learned b { color: var(--green); }
  .stats .skipped b { color: var(--red); }

  /* CARD SCENE */
  .scene {
    width: min(420px, 92vw);
    height: 260px;
    perspective: 1200px;
    position: relative;
    z-index: 1;
    margin-bottom: 1.5rem;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
    cursor: pointer;
    user-select: none;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 16px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    gap: 0.5rem;
    background: var(--card-bg);
    overflow: hidden;
  }

  .card-face::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(245,200,66,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .card-front .hint {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .card-front .category-badge {
    position: absolute;
    top: 1rem; left: 1rem;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(245,200,66,0.12);
    color: var(--gold-dim);
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
  }

  .card-front .pos-badge {
    position: absolute;
    top: 1rem; right: 1rem;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
  }

  .card-front .word {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 700;
    color: var(--text);
    text-align: center;
    line-height: 1.1;
  }

  .card-front .phonetic {
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
  }

  .card-back {
    transform: rotateY(180deg);
  }

  .card-back .translation {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    color: var(--gold);
    text-align: center;
    line-height: 1.2;
  }

  .card-back .original {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }

  .card-back .flip-back-hint {
    position: absolute;
    bottom: 1rem;
    font-size: 0.6rem;
    color: var(--border);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Counter */
  .counter {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-bottom: 1.5rem;
    z-index: 1;
    position: relative;
  }

  /* Action buttons */
  .actions {
    display: flex;
    gap: 1rem;
    z-index: 1;
    position: relative;
    margin-bottom: 1.5rem;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.75rem 1.6rem;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .btn-skip {
    background: rgba(248,113,113,0.1);
    color: var(--red);
    border: 1px solid rgba(248,113,113,0.25);
  }
  .btn-skip:hover { background: rgba(248,113,113,0.2); transform: translateY(-1px); }

  .btn-next {
    background: var(--gold);
    color: #000;
    font-weight: 500;
  }
  .btn-next:hover { background: #f7d45a; transform: translateY(-1px); }

  .btn-know {
    background: rgba(74,222,128,0.1);
    color: var(--green);
    border: 1px solid rgba(74,222,128,0.25);
  }
  .btn-know:hover { background: rgba(74,222,128,0.2); transform: translateY(-1px); }

  /* Progress bar */
  .progress-wrap {
    width: min(420px, 92vw);
    height: 3px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    z-index: 1;
    position: relative;
    margin-bottom: 2.5rem;
  }

  .progress-bar {
    height: 100%;
    background: var(--gold);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  /* Mode toggle */
  .mode-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2rem;
    z-index: 1;
    position: relative;
  }

  .mode-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 0.35rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active { background: var(--border); color: var(--text); }

  /* Done screen */
  .done-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    z-index: 1;
    position: relative;
    text-align: center;
  }

  .done-screen.visible { display: flex; }

  .done-screen h2 {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: var(--gold);
  }

  .done-screen p { color: var(--muted); font-size: 0.8rem; line-height: 1.6; }

  .btn-restart {
    background: var(--gold);
    color: #000;
    border: none;
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.8rem 2rem;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: background 0.15s;
  }
  .btn-restart:hover { background: #f7d45a; }

  .main-area { display: flex; flex-direction: column; align-items: center; width: 100%; }

  /* Shuffle animation */
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .scene { animation: slideIn 0.35s ease; }
</style>
</head>
<body>

<header>
  <h1>Fiszki</h1>
  <p>Naciśnij kartę, żeby zobaczyć tłumaczenie</p>
</header>

<div class="filters" id="filters"></div>

<div class="stats">
  <span class="learned">✓ <b id="learnedCount">0</b> znam</span>
  <span><b id="remainCount">0</b> pozostało</span>
  <span class="skipped">✗ <b id="skipCount">0</b> powtórz</span>
</div>

<div class="mode-row">
  <button class="mode-btn active" onclick="setMode('pl')">PL → EN</button>
  <button class="mode-btn" onclick="setMode('en')">EN → PL</button>
  <button class="mode-btn" onclick="shuffle()">🔀 Tasuj</button>
</div>

<div class="main-area" id="mainArea">
  <div class="scene" id="scene" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <span class="category-badge" id="catBadge"></span>
        <span class="pos-badge" id="posBadge"></span>
        <div class="hint" id="frontHint">słówko</div>
        <div class="word" id="frontWord"></div>
        <div class="phonetic" id="frontPhonetic"></div>
      </div>
      <div class="card-face card-back">
        <div class="translation" id="backTranslation"></div>
        <div class="original" id="backOriginal"></div>
        <div class="flip-back-hint">kliknij, żeby wrócić</div>
      </div>
    </div>
  </div>

  <div class="counter" id="counter"></div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="actions" id="actions">
    <button class="btn btn-skip" onclick="markSkip()">✗ Nie znam</button>
    <button class="btn btn-next" onclick="nextCard()">→ Następna</button>
    <button class="btn btn-know" onclick="markKnow()">✓ Znam</button>
  </div>

  <div class="done-screen" id="doneScreen">
    <h2>Koniec rundy! 🎉</h2>
    <p id="doneText"></p>
    <button class="btn-restart" onclick="restart()">Zacznij od nowa</button>
    <button class="btn-restart" style="background:#2a2a2e;color:var(--text);margin-top:0" onclick="restartSkipped()">Powtórz nieznane</button>
  </div>
</div>

  {en:"artist",pl:"artysta",pos:"n",cat:"Przyrostki",ph:"/ˈɑːtɪst/"},
  {en:"confidence",pl:"pewność siebie",pos:"n",cat:"Przyrostki",ph:"/ˈkɒnfɪd(ə)ns/"},
  {en:"creation",pl:"tworzenie",pos:"n",cat:"Przyrostki",ph:"/kriˈeɪʃ(ə)n/"},
  {en:"creativity",pl:"kreatywność",pos:"n",cat:"Przyrostki",ph:"/ˌkriːeɪˈtɪvɪti/"},
  {en:"creator",pl:"twórca",pos:"n",cat:"Przyrostki",ph:"/kriˈeɪtər/"},
  {en:"darkness",pl:"ciemność",pos:"n",cat:"Przyrostki",ph:"/ˈdɑːknəs/"},
  {en:"difference",pl:"różnica",pos:"n",cat:"Przyrostki",ph:"/ˈdɪfrəns/"},
  {en:"direction",pl:"kierunek",pos:"n",cat:"Przyrostki",ph:"/daɪˈrekʃ(ə)n/"},
  {en:"education",pl:"edukacja",pos:"n",cat:"Przyrostki",ph:"/ˌedjʊˈkeɪʃ(ə)n/"},
  {en:"educator",pl:"pedagog",pos:"n",cat:"Przyrostki",ph:"/ˈedjʊkeɪtər/"},
  {en:"electrician",pl:"elektryk",pos:"n",cat:"Przyrostki",ph:"/ɪˌlekˈtrɪʃ(ə)n/"},
];

let deck = [];
let current = 0;
let mode = 'pl'; // 'pl' = show PL guess EN, 'en' = show EN guess PL
let learned = new Set();
let skipped = new Set();
let activeFilter = 'Wszystkie';

function getCategories() {
  const cats = ['Wszystkie', ...new Set(ALL_WORDS.map(w => w.cat))];
  return cats;
}

function buildFilters() {
  const wrap = document.getElementById('filters');
  wrap.innerHTML = '';
  getCategories().forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === activeFilter ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { activeFilter = cat; buildFilters(); initDeck(); };
    wrap.appendChild(btn);
  });
}

function initDeck() {
  let base = activeFilter === 'Wszystkie' ? ALL_WORDS : ALL_WORDS.filter(w => w.cat === activeFilter);
  deck = [...base].sort(() => Math.random() - 0.5);
  learned = new Set();
  skipped = new Set();
  current = 0;
  document.getElementById('doneScreen').classList.remove('visible');
  document.getElementById('mainArea').querySelector('.scene').style.display = '';
  document.getElementById('counter').style.display = '';
  document.getElementById('actions').style.display = '';
  document.getElementById('progressBar').parentElement.style.display = '';
  renderCard();
  updateStats();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach((b,i) => b.classList.toggle('active', (i===0 && m==='pl')||(i===1 && m==='en')));
  renderCard();
}

function shuffle() {
  deck = [...deck].sort(() => Math.random() - 0.5);
  current = 0;
  renderCard();
}

function renderCard() {
  const card = document.getElementById('card');
  card.classList.remove('flipped');

  const scene = document.getElementById('scene');
  scene.style.animation = 'none';
  void scene.offsetWidth;
  scene.style.animation = '';

  if (current >= deck.length) { showDone(); return; }
  const w = deck[current];

  document.getElementById('catBadge').textContent = w.cat;
  document.getElementById('posBadge').textContent = w.pos;

  if (mode === 'en') {
    document.getElementById('frontHint').textContent = 'angielskie';
    document.getElementById('frontWord').textContent = w.en;
    document.getElementById('frontPhonetic').textContent = w.ph;
    document.getElementById('backTranslation').textContent = w.pl;
    document.getElementById('backOriginal').textContent = w.en;
  } else {
    document.getElementById('frontHint').textContent = 'polskie';
    document.getElementById('frontWord').textContent = w.pl;
    document.getElementById('frontPhonetic').textContent = '';
    document.getElementById('backTranslation').textContent = w.en;
    document.getElementById('backOriginal').textContent = w.ph;
  }

  updateCounter();
  updateStats();
  updateProgress();
}

function flipCard() {
  document.getElementById('card').classList.toggle('flipped');
}

function nextCard() {
  current++;
  renderCard();
}

function markKnow() {
  learned.add(deck[current].en);
  skipped.delete(deck[current].en);
  current++;
  renderCard();
}

function markSkip() {
  skipped.add(deck[current].en);
  learned.delete(deck[current].en);
  current++;
  renderCard();
}

function updateCounter() {
  document.getElementById('counter').textContent = `${current + 1} / ${deck.length}`;
}

function updateStats() {
  document.getElementById('learnedCount').textContent = learned.size;
  document.getElementById('skipCount').textContent = skipped.size;
  document.getElementById('remainCount').textContent = deck.length - current;
}

function updateProgress() {
  const pct = (current / deck.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
}

function showDone() {
  document.getElementById('doneScreen').classList.add('visible');
  document.getElementById('scene').style.display = 'none';
  document.getElementById('counter').style.display = 'none';
  document.getElementById('actions').style.display = 'none';
  document.getElementById('progressBar').parentElement.style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('doneText').innerHTML =
    `Poznałeś <b style="color:var(--green)">${learned.size}</b> słówek, <b style="color:var(--red)">${skipped.size}</b> do powtórzenia.`;
  updateStats();
}

function restart() {
  initDeck();
}

function restartSkipped() {
  if (skipped.size === 0) { restart(); return; }
  deck = ALL_WORDS.filter(w => skipped.has(w.en)).sort(() => Math.random() - 0.5);
  learned = new Set();
  skipped = new Set();
  current = 0;
  document.getElementById('doneScreen').classList.remove('visible');
  document.getElementById('scene').style.display = '';
  document.getElementById('counter').style.display = '';
  document.getElementById('actions').style.display = '';
  document.getElementById('progressBar').parentElement.style.display = '';
  renderCard();
  updateStats();
}

buildFilters();
initDeck();
</script>
</body>
</html>
